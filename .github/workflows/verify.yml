name: Verify recorded exhibition
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node scripts/verify-export.mjs
      - run: node tests/browser/showcase.mjs
      # Oracle integration is separately recorded on the dedicated actual lab.
      # No provider secret or paid call is needed by this workflow.
